<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Page - Activity 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="design.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"></script>
</head>
<body>
  <main>
    <div class="glass-card">
      <h2 class="register-title">Register</h2>
      <form id="registerForm">
        <div class="input-group user">
          <label for="username">Username</label>
          <input type="text" id="username" name="username">
        </div>
        <div class="input-group email">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email">
        </div>
        <div class="input-group phone">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone">
        </div>
        <div class="input-group password">
          <label for="password">Password</label>
          <input type="password" id="password" name="password">
        </div>
        <div class="input-group password">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" name="confirm">
        </div>
        <button type="submit" class="btn-custom">Register</button>
        <p>Already have an account? <a href="login.html">Login here</a></p>
      </form>
    </div>
  </main>

  <script>
    $(document).ready(function() {
      $.validator.addMethod("noNumbers", function(value) {
        return !/\d/.test(value);
      }, "Username cannot contain numbers");

      $.validator.addMethod("notAllUpper", function(value) {
        return value !== value.toUpperCase();
      }, "Username cannot be all uppercase");

      $("#registerForm").validate({
        rules: {
          username: { required: true, minlength: 3, noNumbers: true, notAllUpper: true },
          email: { required: true, email: true },
          phone: { required: true, digits: true, minlength: 10, maxlength: 15 },
          password: { required: true, minlength: 5 },
          confirm: { required: true, equalTo: "#password" }
        },
        messages: {
          username: {
            required: "Please enter a username",
            minlength: function(p, el) { return "You entered " + el.value.length + " characters, minimum is " + p; }
          },
          email: { required: "Please enter your email", email: "Please enter a valid email address" },
          phone: {
            required: "Please enter your phone number",
            digits: "Only numbers are allowed",
            minlength: function(p, el) { return "You entered " + el.value.length + " digits, minimum is " + p; },
            maxlength: function(p, el) { return "You entered " + el.value.length + " digits, maximum allowed is " + p; }
          },
          password: {
            required: "Please provide a password",
            minlength: function(p, el) { return "You entered " + el.value.length + " characters, minimum is " + p; }
          },
          confirm: { required: "Please confirm your password", equalTo: "Passwords do not match" }
        },
        onkeyup: function(el) { $(el).valid(); },
        onfocusout: function(el) { $(el).valid(); },
        submitHandler: function(form) {
          window.location.href = "registered-successful.html";
        }
      });
    });
  </script>
</body>
</html>
